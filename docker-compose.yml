services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////data/crm.db
      STATIC_DIR: /data/static
      SECRET_KEY: ${SECRET_KEY:-dev-docker-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost,http://127.0.0.1:8080}
    volumes:
      - crm_data:/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  crm_data:
